name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  compatibility-and-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_WITHOUT: development
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.4.12'
          bundler-cache: true
      - name: Check current dependency advisories
        run: bundle exec bundle-audit check --update --config .bundler-audit.yml
      - name: Test application compatibility with synthetic data
        run: bundle exec ruby test/application_test.rb
